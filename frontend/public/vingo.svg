
<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF512F"/>
      <stop offset="1" stop-color="#DD2476"/>
    </linearGradient>

    <linearGradient id="vGradient" x1="120" y1="120" x2="380" y2="380" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFE8E8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="120" fill="url(#bg)"/>

  <!-- Plate Circle -->
  <circle cx="256" cy="256" r="150" fill="rgba(255,255,255,0.12)" stroke="white" stroke-width="10"/>

  <!-- Stylish V -->
  <path d="M155 150L235 360C240 375 260 375 265 360L355 150"
        stroke="url(#vGradient)"
        stroke-width="42"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Fork -->
  <path d="M365 165V285"
        stroke="white"
        stroke-width="16"
        stroke-linecap="round"/>

  <path d="M345 165V220M365 165V220M385 165V220"
        stroke="white"
        stroke-width="10"
        stroke-linecap="round"/>

  <!-- Speed lines -->
  <path d="M90 220H145" stroke="white" stroke-width="12" stroke-linecap="round" opacity="0.8"/>
  <path d="M70 255H135" stroke="white" stroke-width="12" stroke-linecap="round" opacity="0.6"/>
  <path d="M95 290H150" stroke="white" stroke-width="12" stroke-linecap="round" opacity="0.4"/>
</svg>
